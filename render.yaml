databases:
  - name: cp-tracker-db
    plan: free
services:
  - type: web
    name: cp-tracker
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cp-tracker-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
